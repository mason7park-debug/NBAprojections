name: NBA nightly projections

# Fetches from ESPN, not stats.nba.com.
#
# History: stats.nba.com blackholes datacenter IPs, so the first scheduled run
# here timed out on all five endpoints. It was then also unreachable from a
# residential connection (2026-11-06), so the local-runner fallback failed too.
# ESPN's public endpoints work from cloud runners, so the schedule is back.
#
# scripts/fetch_nba_data.py (nba.com) is kept for manual retry -- if nba.com
# becomes reachable again it restores the tracking stats ESPN lacks.
on:
  schedule:
    # GitHub starts scheduled runs late on this repo, sometimes by hours, so the run
    # does not depend on the clock. Every run does both jobs: it grades the last slate
    # if box scores are in, then projects today's games. Games that have tipped stay
    # locked, so extra or late runs do no harm. Times are UTC; several are listed so
    # that at least one lands before the first tip (7pm Eastern on most nights).
    - cron: "43 12 * * *"
    - cron: "7 14 * * *"
    - cron: "31 15 * * *"
    - cron: "7 17 * * *"
    - cron: "31 18 * * *"
    - cron: "7 20 * * *"
    - cron: "37 21 * * *"
    - cron: "27 22 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Each fetch commits what it got even if part of it failed; checked at the end.
      - name: Fetch last night's results
        id: results
        continue-on-error: true
        run: python scripts/fetch_espn.py --mode results --out data

      - name: Grade last night
        continue-on-error: true
        run: python scripts/nightly.py grade

      - name: Fetch today's slate, odds and injuries
        id: pregame
        continue-on-error: true
        run: python scripts/fetch_espn.py --mode pregame --out data

      # Optional. Does nothing unless the ODDS_API_KEY secret is set.
      - name: Fetch prop lines
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROP_MARKETS: ${{ vars.PROP_MARKETS }}
        run: python scripts/fetch_props.py --out data

      - name: Project today
        id: project
        continue-on-error: true
        run: python scripts/nightly.py project

      - name: Commit
        if: always()
        run: |
          git config user.name  "nba-data-bot"
          git config user.email "actions@github.com"
          git add data logs docs
          git diff --staged --quiet || git commit -m "nightly: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase
          git push

      - name: Report problems
        if: steps.results.outcome == 'failure' || steps.pregame.outcome == 'failure' || steps.project.outcome == 'failure'
        run: |
          echo "A fetch or the projection step had a problem. What it did get was committed."
          exit 1
