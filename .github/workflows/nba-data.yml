name: NBA data snapshot

# SCHEDULE DISABLED 2026-11-06.
#
# stats.nba.com blackholes cloud-provider IP ranges. From GitHub runners every
# request times out (not 403, not 429 -- packets are dropped), so all five
# endpoints failed 4/4 attempts on the first scheduled run. cdn.nba.com is
# reachable and serves schedule/box scores, but NOT the tracking stats
# (rebound chances, potential assists) this project is built on.
#
# The fetch now runs on a residential connection via scripts/run_and_push.sh,
# scheduled by scripts/com.mason.nbadata.plist. This repo is storage only.
#
# Kept as manual-dispatch so the block can be re-tested later if nba.com
# changes policy. Do not re-enable the cron without a passing manual run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pregame or results"
        required: true
        default: pregame

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install nba_api pandas

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 22 * * *" ]; then
            echo "mode=pregame" >> "$GITHUB_OUTPUT"
          else
            echo "mode=results" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch
        run: python scripts/fetch_nba_data.py --mode "${{ steps.mode.outputs.mode }}" --out data

      - name: Commit
        run: |
          git config user.name  "nba-data-bot"
          git config user.email "actions@github.com"
          git add data logs
          git diff --staged --quiet || git commit -m "snapshot: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%d)"
          git push
