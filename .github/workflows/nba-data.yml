name: NBA data snapshot

# Fetches from ESPN, not stats.nba.com.
#
# History: stats.nba.com blackholes datacenter IPs, so the first scheduled run
# here timed out on all five endpoints. It was then also unreachable from a
# residential connection (2026-11-06), so the local-runner fallback failed too.
# ESPN's public endpoints work from cloud runners, so the schedule is back.
#
# scripts/fetch_nba_data.py (nba.com) is kept for manual retry -- if nba.com
# becomes reachable again it restores the tracking stats ESPN lacks.
on:
  schedule:
    # UTC. GitHub's scheduler slips 5-20 min regardless of the minute chosen.
    - cron: "37 22 * * *"   # ~5:37pm ET -- pregame, before first tip
    - cron: "43 13 * * *"   # ~8:43am ET -- results from the night before
  workflow_dispatch:
    inputs:
      mode:
        description: "pregame or results"
        required: true
        default: pregame

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 22 * * *" ]; then
            echo "mode=pregame" >> "$GITHUB_OUTPUT"
          else
            echo "mode=results" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch
        run: python scripts/fetch_espn.py --mode "${{ steps.mode.outputs.mode }}" --out data

      - name: Commit
        run: |
          git config user.name  "nba-data-bot"
          git config user.email "actions@github.com"
          git add data logs
          git diff --staged --quiet || git commit -m "snapshot: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%d)"
          git push
